<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="A removed DOM node still held by a JavaScript reference, so it cannot be collected">
  <rect width="480" height="240" fill="#f8fafc"/>
  <rect x="28" y="30" width="150" height="76" rx="8" fill="#ffffff" stroke="#1f2937"/>
  <text x="103" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f2937">document</text>
  <rect x="48" y="68" width="110" height="22" rx="4" fill="#e2e8f0"/>
  <text x="103" y="83" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">body</text>
  <rect x="220" y="120" width="140" height="64" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="5 4"/>
  <text x="290" y="146" text-anchor="middle" font-family="monospace" font-size="12" fill="#991b1b">removed .card</text>
  <text x="290" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">no longer on the page</text>
  <rect x="330" y="30" width="122" height="60" rx="8" fill="#ffffff" stroke="#1f2937"/>
  <text x="391" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">JS variable</text>
  <text x="391" y="74" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">lastCard</text>
  <line x1="330" y1="78" x2="308" y2="128" stroke="#ef4444" stroke-width="2"/>
  <polygon points="308,128 312,116 320,123" fill="#ef4444"/>
  <text x="240" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">the reference keeps the node alive, so the heap grows</text>
</svg>
