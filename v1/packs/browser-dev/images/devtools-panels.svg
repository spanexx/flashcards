<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="DevTools with Elements, Console, Sources, Network and Application tabs">
  <rect width="480" height="240" fill="#f8fafc"/>
  <rect x="24" y="24" width="432" height="192" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="24" y="24" width="432" height="36" rx="10" fill="#e2e8f0"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="44" y="47">Elements</text>
    <text x="112" y="47">Console</text>
    <text x="176" y="47">Sources</text>
    <text x="238" y="47">Network</text>
    <text x="302" y="47">Performance</text>
    <text x="392" y="47">Application</text>
  </g>
  <line x1="40" y1="82" x2="200" y2="82" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="40" y1="102" x2="170" y2="102" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="40" y1="122" x2="220" y2="122" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="40" y1="142" x2="150" y2="142" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">one panel at a time</text>
  <text x="320" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">the tabs switch the view</text>
