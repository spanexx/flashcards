<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="A visible label tied to an input gives the control an accessible name">
  <rect width="480" height="240" fill="#f8fafc"/>
  <text x="40" y="52" font-family="sans-serif" font-size="14" font-weight="700" fill="#1f2937">Good: a visible label</text>
  <text x="40" y="82" font-family="sans-serif" font-size="13" fill="#1f2937">Email</text>
  <rect x="92" y="66" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f2937"/>
  <text x="40" y="128" font-family="monospace" font-size="11" fill="#059669">&lt;label for="email"&gt;Email&lt;/label&gt;</text>
  <text x="40" y="146" font-family="monospace" font-size="11" fill="#059669">&lt;input id="email"&gt;</text>
  <text x="40" y="194" font-family="sans-serif" font-size="14" font-weight="700" fill="#1f2937">Weak: a placeholder only</text>
  <rect x="40" y="204" width="190" height="28" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="52" y="223" font-family="sans-serif" font-size="12" fill="#92400e">name@example.com</text>
  <text x="300" y="100" font-family="sans-serif" font-size="12" fill="#64748b">the label becomes</text>
  <text x="300" y="120" font-family="sans-serif" font-size="12" fill="#64748b">the accessible name</text>
  <text x="300" y="152" font-family="sans-serif" font-size="12" fill="#64748b">a placeholder vanishes</text>
  <text x="300" y="172" font-family="sans-serif" font-size="12" fill="#64748b">when the learner types</text>
</svg>
