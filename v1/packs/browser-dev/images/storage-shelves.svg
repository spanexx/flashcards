<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Four storage shelves: cookies, localStorage, sessionStorage and IndexedDB">
  <rect width="480" height="240" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <rect x="24" y="28" width="100" height="80" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="74" y="52" text-anchor="middle" font-weight="700">cookies</text>
    <text x="74" y="74" text-anchor="middle" fill="#64748b">sent with</text>
    <text x="74" y="90" text-anchor="middle" fill="#64748b">requests</text>
    <rect x="140" y="28" width="110" height="80" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="195" y="52" text-anchor="middle" font-weight="700">localStorage</text>
    <text x="195" y="74" text-anchor="middle" fill="#64748b">all tabs,</text>
    <text x="195" y="90" text-anchor="middle" fill="#64748b">strings only</text>
    <rect x="266" y="28" width="110" height="80" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="321" y="52" text-anchor="middle" font-weight="700">sessionStorage</text>
    <text x="321" y="74" text-anchor="middle" fill="#64748b">one tab,</text>
    <text x="321" y="90" text-anchor="middle" fill="#64748b">one session</text>
    <rect x="392" y="28" width="64" height="80" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="424" y="52" text-anchor="middle" font-weight="700">IndexedDB</text>
    <text x="424" y="74" text-anchor="middle" fill="#64748b">large,</text>
    <text x="424" y="90" text-anchor="middle" fill="#64748b">async</text>
  </g>
  <rect x="24" y="128" width="432" height="76" rx="8" fill="#e2e8f0"/>
  <text x="240" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">All four belong to one origin: scheme, host and port.</text>
  <text x="240" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Clearing site data empties every shelf, and the caches too.</text>
</svg>
