<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="A debugging recipe: reproduce, observe, narrow, fix, prove">
  <rect width="480" height="240" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
    <rect x="18" y="92" width="76" height="46" rx="8" fill="#2563eb"/>
    <text x="56" y="112">reproduce</text>
    <text x="56" y="127">it</text>
    <rect x="112" y="92" width="76" height="46" rx="8" fill="#2563eb"/>
    <text x="150" y="112">observe</text>
    <text x="150" y="127">the error</text>
    <rect x="206" y="92" width="76" height="46" rx="8" fill="#2563eb"/>
    <text x="244" y="112">narrow the</text>
    <text x="244" y="127">suspects</text>
    <rect x="300" y="92" width="76" height="46" rx="8" fill="#059669"/>
    <text x="338" y="112">fix one</text>
    <text x="338" y="127">cause</text>
    <rect x="394" y="92" width="68" height="46" rx="8" fill="#059669"/>
    <text x="428" y="112">prove it</text>
    <text x="428" y="127">is gone</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="94" y1="115" x2="112" y2="115"/>
    <line x1="188" y1="115" x2="206" y2="115"/>
    <line x1="282" y1="115" x2="300" y2="115"/>
    <line x1="376" y1="115" x2="394" y2="115"/>
  </g>
  <text x="240" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f2937">a bug you cannot repeat cannot be fixed</text>
  <text x="240" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">write down the steps before you change anything</text>
  <text x="240" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">then disable half the suspects at a time</text>
</svg>
