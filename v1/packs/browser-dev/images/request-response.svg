<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Browser and server exchanging a request and a response">
  <rect width="480" height="240" fill="#f8fafc"/>
  <rect x="32" y="56" width="150" height="128" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="298" y="56" width="150" height="128" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="107" y="88" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1f2937">Browser</text>
  <text x="373" y="88" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1f2937">Server</text>
  <line x1="182" y1="128" x2="292" y2="128" stroke="#2563eb" stroke-width="2"/>
  <polygon points="292,128 280,122 280,134" fill="#2563eb"/>
  <text x="237" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2563eb">request</text>
  <line x1="298" y1="160" x2="188" y2="160" stroke="#059669" stroke-width="2"/>
  <polygon points="188,160 200,154 200,166" fill="#059669"/>
  <text x="243" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#059669">response</text>
  <text x="240" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">then the browser parses, lays out and paints</text>
</svg>
