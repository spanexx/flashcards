<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="A network waterfall: queueing, waiting for the first byte, then downloading the body">
  <rect width="480" height="240" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="32" y="40">document</text>
    <text x="32" y="72">styles.css</text>
    <text x="32" y="104">app.js</text>
    <text x="32" y="136">photo.jpg</text>
  </g>
  <g>
    <rect x="120" y="30" width="50" height="14" fill="#cbd5e1"/>
    <rect x="170" y="30" width="90" height="14" fill="#93c5fd"/>
    <rect x="260" y="30" width="120" height="14" fill="#2563eb"/>
    <rect x="120" y="62" width="20" height="14" fill="#cbd5e1"/>
    <rect x="140" y="62" width="50" height="14" fill="#93c5fd"/>
    <rect x="190" y="62" width="60" height="14" fill="#2563eb"/>
    <rect x="120" y="94" width="140" height="14" fill="#cbd5e1"/>
    <rect x="260" y="94" width="70" height="14" fill="#93c5fd"/>
    <rect x="330" y="94" width="100" height="14" fill="#2563eb"/>
    <rect x="120" y="126" width="20" height="14" fill="#cbd5e1"/>
    <rect x="140" y="126" width="40" height="14" fill="#93c5fd"/>
    <rect x="180" y="126" width="240" height="14" fill="#2563eb"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#64748b">
    <rect x="120" y="176" width="12" height="12" fill="#cbd5e1"/>
    <text x="138" y="186">queued</text>
    <rect x="210" y="176" width="12" height="12" fill="#93c5fd"/>
    <text x="228" y="186">waiting for the first byte</text>
    <rect x="390" y="176" width="12" height="12" fill="#2563eb"/>
    <text x="408" y="186">download</text>
  </g>
  <text x="240" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">a long bar is where the time goes</text>
</svg>
