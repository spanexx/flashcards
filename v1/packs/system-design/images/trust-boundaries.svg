<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Draw the trust boundaries before the threats</title>
  <desc id="d">A request crosses from the browser to the API, then a worker and database; STRIDE labels sit on the crossings.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .box{fill:#ffffff;stroke:#1f2933;stroke-width:1.4}
    .zone{fill:#eef2f4;stroke:#2f6f8f;stroke-width:1.2}
    .dash{stroke:#a23b3b;stroke-width:1.5;stroke-dasharray:8 6}
    .tag{fill:#f6e2e0;stroke:#a23b3b;stroke-width:1}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">Draw the trust boundaries before the threats</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">Every crossing is somewhere identity, data or control can be attacked.</text>

  <rect x="40" y="150" width="160" height="150" rx="10" class="zone"/>
  <text x="120" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">browser</text>
  <text x="120" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">untrusted input</text>
  <text x="120" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">public network</text>

  <line x1="230" y1="120" x2="230" y2="390" class="dash"/>
  <line x1="455" y1="120" x2="455" y2="390" class="dash"/>
  <line x1="640" y1="120" x2="640" y2="390" class="dash"/>

  <rect x="260" y="170" width="140" height="110" rx="9" class="box"/>
  <text x="330" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">API</text>
  <text x="330" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">authenticate</text>
  <text x="330" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">validate</text>

  <rect x="485" y="170" width="120" height="110" rx="9" class="box"/>
  <text x="545" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">worker</text>
  <text x="545" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">least privilege</text>
  <text x="545" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">no secrets in logs</text>

  <rect x="670" y="170" width="100" height="110" rx="9" class="box"/>
  <text x="720" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">data</text>
  <text x="720" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">encrypted</text>
  <text x="720" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">backed up</text>

  <rect x="80" y="320" width="190" height="30" rx="15" class="tag"/>
  <text x="175" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="ink">spoofing · tampering</text>
  <rect x="310" y="320" width="180" height="30" rx="15" class="tag"/>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="ink">disclosure · DoS</text>
  <rect x="520" y="320" width="220" height="30" rx="15" class="tag"/>
  <text x="630" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="ink">elevation · repudiation</text>

  <path d="M 200 225 L 255 225" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 400 225 L 480 225" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 605 225 L 665 225" stroke="#1f2933" stroke-width="1.6" fill="none"/>

  <text x="40" y="430" font-family="system-ui, sans-serif" font-size="13" class="muted">STRIDE gives the questions; the diagram tells you where to ask them.</text>
</svg>
