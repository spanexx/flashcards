<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Deploy and release are separate decisions</title>
  <desc id="d">Code moves through build and deploy with the flag off; the flag then opens to one percent, ten percent and everyone.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .box{fill:#ffffff;stroke:#1f2933;stroke-width:1.5}
    .stage{fill:#e6eff1;stroke:#2f6f8f;stroke-width:1.2}
    .dark{fill:#e9e9e4;stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4}
    .user{fill:#dbe7dc;stroke:#3f7d5a;stroke-width:1.2}
    .u1{animation:on 8s ease-in-out infinite}
    .u2{animation:on 8s ease-in-out infinite;animation-delay:2s}
    .u3{animation:on 8s ease-in-out infinite;animation-delay:4s}
    .switch{animation:flip 8s ease-in-out infinite}
    @keyframes on{0%,15%{opacity:.15}30%,100%{opacity:1}}
    @keyframes flip{0%,25%{transform:translateX(0)}45%,100%{transform:translateX(28px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">Deploy and release are separate decisions</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">Ship the code dark, then open it to people when you choose.</text>

  <text x="60" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="600" class="ink">deploy</text>
  <rect x="60" y="132" width="110" height="54" rx="8" class="stage"/>
  <rect x="190" y="132" width="110" height="54" rx="8" class="stage"/>
  <rect x="320" y="132" width="110" height="54" rx="8" class="dark"/>
  <rect x="450" y="132" width="110" height="54" rx="8" class="dark"/>
  <text x="115" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">commit</text>
  <text x="245" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">build</text>
  <text x="375" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">deploy off</text>
  <text x="505" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">in production</text>
  <text x="375" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">no user sees it yet</text>

  <text x="60" y="270" font-family="system-ui, sans-serif" font-size="13" font-weight="600" class="ink">release</text>
  <rect x="60" y="286" width="150" height="58" rx="9" class="box"/>
  <text x="135" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">feature flag</text>
  <rect x="223" y="300" width="56" height="30" rx="15" fill="#e6eff1" stroke="#2f6f8f" stroke-width="1.2"/>
  <circle cx="238" cy="315" r="11" fill="#2f6f8f" class="switch"/>
  <text x="200" y="362" font-family="system-ui, sans-serif" font-size="11" class="muted">off</text>
  <text x="278" y="362" font-family="system-ui, sans-serif" font-size="11" class="muted">on</text>

  <g class="u1"><circle cx="420" cy="315" r="12" class="user"/><text x="420" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" class="ink">1</text></g>
  <g class="u2"><circle cx="470" cy="315" r="12" class="user"/><circle cx="505" cy="315" r="12" class="user"/><text x="488" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" class="ink">10</text></g>
  <g class="u3"><circle cx="560" cy="315" r="12" class="user"/><circle cx="595" cy="315" r="12" class="user"/><circle cx="630" cy="315" r="12" class="user"/><circle cx="665" cy="315" r="12" class="user"/><text x="612" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" class="ink">all</text></g>

  <text x="40" y="410" font-family="system-ui, sans-serif" font-size="13" class="muted">A flag is inventory: name an owner and a date to remove it.</text>
</svg>
