<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="The CSS box model: margin outside border, then padding, then the content box">
  <rect width="480" height="240" fill="#f8fafc"/>
  <rect x="52" y="24" width="376" height="184" fill="#fef3c7"/>
  <rect x="84" y="46" width="312" height="140" fill="#fde68a"/>
  <rect x="116" y="68" width="248" height="96" fill="#bfdbfe"/>
  <rect x="148" y="90" width="184" height="52" fill="#ffffff" stroke="#1f2937"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="240" y="122" font-weight="700">content</text>
    <text x="240" y="82">padding</text>
    <text x="240" y="60">border</text>
    <text x="240" y="40">margin</text>
  </g>
  <text x="240" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">border-box width covers content, padding and border, not margin</text>
</svg>
