<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="A main-thread timeline with one task longer than fifty milliseconds">
  <rect width="480" height="240" fill="#f8fafc"/>
  <text x="32" y="44" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f2937">main thread</text>
  <rect x="32" y="58" width="416" height="44" rx="6" fill="#e2e8f0"/>
  <rect x="44" y="64" width="54" height="32" fill="#93c5fd"/>
  <rect x="104" y="64" width="34" height="32" fill="#93c5fd"/>
  <rect x="144" y="64" width="180" height="32" fill="#ef4444"/>
  <rect x="330" y="64" width="40" height="32" fill="#93c5fd"/>
  <rect x="376" y="64" width="58" height="32" fill="#93c5fd"/>
  <text x="234" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">long task</text>
  <line x1="144" y1="118" x2="144" y2="136" stroke="#64748b"/>
  <line x1="324" y1="118" x2="324" y2="136" stroke="#64748b"/>
  <line x1="144" y1="130" x2="324" y2="130" stroke="#64748b"/>
  <text x="234" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">anything over 50 ms</text>
  <text x="240" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">during a long task, clicks and paints wait in line.</text>
  <text x="240" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">smaller tasks keep the page responsive.</text>
</svg>
