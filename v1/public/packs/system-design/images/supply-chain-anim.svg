<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Prove what you ship</title>
  <desc id="d">A build artifact travels through build, test, inventory and signing; an unsigned package is stopped at the policy gate before deploy.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .box{fill:#ffffff;stroke:#1f2933;stroke-width:1.5}
    .stage{fill:#e6eff1;stroke:#2f6f8f;stroke-width:1.2}
    .gate{fill:#f6e2e0;stroke:#a23b3b;stroke-width:1.6}
    .good{fill:#e5efe8;stroke:#3f7d5a;stroke-width:1.4}
    .seal{animation:seal 8s ease-in-out infinite}
    .blocked{animation:blocked 8s ease-in-out infinite}
    @keyframes seal{0%,35%{opacity:.2}50%,100%{opacity:1}}
    @keyframes blocked{0%,45%{opacity:.15}60%,85%{opacity:1}100%{opacity:.15}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">Prove what you ship</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">A signature says who built it; provenance says from what and how.</text>

  <rect x="40" y="160" width="100" height="62" rx="8" class="stage"/>
  <rect x="160" y="160" width="100" height="62" rx="8" class="stage"/>
  <rect x="280" y="160" width="100" height="62" rx="8" class="stage"/>
  <rect x="400" y="160" width="100" height="62" rx="8" class="stage"/>
  <rect x="520" y="160" width="100" height="62" rx="8" class="good"/>
  <rect x="640" y="160" width="100" height="62" rx="8" class="stage"/>
  <text x="90" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">build</text>
  <text x="210" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">test</text>
  <text x="330" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">inventory</text>
  <text x="450" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">sign</text>
  <text x="570" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">deploy</text>
  <text x="690" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">observe</text>
  <text x="330" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">SBOM + hashes</text>
  <text x="450" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">sealed artifact</text>

  <rect x="520" y="285" width="220" height="86" rx="9" class="gate blocked"/>
  <text x="630" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" class="ink">policy gate</text>
  <text x="630" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="muted">unsigned or unknown source?</text>
  <text x="630" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="muted">stop here</text>

  <circle r="5" fill="#2f6f8f">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 90 130 L 210 130 L 330 130 L 450 130 L 570 130 L 690 130"/>
  </circle>
  <circle r="5" fill="#a23b3b">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 330 265 L 520 325"/>
  </circle>
  <text x="425" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#a23b3b">unknown dependency</text>

  <text x="520" y="130" class="seal" font-family="system-ui, sans-serif" font-size="12" fill="#3f7d5a">sealed with a signature</text>

  <text x="40" y="410" font-family="system-ui, sans-serif" font-size="13" class="muted">The chain is only as strong as the weakest unsigned step.</text>
</svg>
