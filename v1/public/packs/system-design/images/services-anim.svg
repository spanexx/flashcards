<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">From one box to independent services</title>
  <desc id="d">Traffic reaches a single deployable on the left; on the right four services fail independently while the others keep serving.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .box{fill:#ffffff;stroke:#1f2933;stroke-width:1.6}
    .svc{fill:#e6eff1;stroke:#2f6f8f;stroke-width:1.3}
    .bad{fill:#f6e2e0;stroke:#a23b3b;stroke-width:1.6}
    .ok{fill:#e5efe8;stroke:#3f7d5a;stroke-width:1.3}
    .fail{animation:fail 9s ease-in-out infinite}
    .flow{fill:#2f6f8f}
    @keyframes fail{0%,55%{opacity:1}70%,100%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">From one box to independent services</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">Splitting adds a network call and buys independent failure.</text>

  <text x="170" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" class="ink">one deployable</text>
  <rect x="70" y="130" width="200" height="220" rx="12" class="box"/>
  <rect x="90" y="150" width="160" height="42" rx="7" class="svc"/>
  <rect x="90" y="202" width="160" height="42" rx="7" class="svc"/>
  <rect x="90" y="254" width="160" height="42" rx="7" class="svc"/>
  <rect x="90" y="306" width="160" height="42" rx="7" class="svc"/>
  <text x="170" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">orders</text>
  <text x="170" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">payments</text>
  <text x="170" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">catalog</text>
  <text x="170" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">search</text>
  <text x="170" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="muted">one build, one release</text>

  <path d="M 280 240 L 330 240" fill="none" stroke="#1f2933" stroke-width="2"/>
  <path d="M 320 232 L 330 240 L 320 248" fill="none" stroke="#1f2933" stroke-width="2"/>

  <text x="560" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" class="ink">four services</text>
  <rect x="360" y="130" width="90" height="90" rx="9" class="ok"/>
  <rect x="465" y="130" width="90" height="90" rx="9" class="bad fail"/>
  <rect x="570" y="130" width="90" height="90" rx="9" class="ok"/>
  <rect x="675" y="130" width="90" height="90" rx="9" class="ok"/>
  <rect x="360" y="245" width="90" height="90" rx="9" class="ok"/>
  <rect x="465" y="245" width="90" height="90" rx="9" class="ok"/>
  <rect x="570" y="245" width="90" height="90" rx="9" class="ok"/>
  <rect x="675" y="245" width="90" height="90" rx="9" class="ok"/>
  <text x="405" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">orders</text>
  <text x="510" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">payments</text>
  <text x="615" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">catalog</text>
  <text x="720" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">search</text>
  <text x="405" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">email</text>
  <text x="510" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">auth</text>
  <text x="615" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">files</text>
  <text x="720" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">jobs</text>
  <text x="510" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">down</text>
  <text x="560" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="muted">each service ships on its own</text>

  <circle r="5" class="flow">
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M 300 240 L 340 240 M 340 240 L 405 175 M 405 175 L 615 175 M 615 175 L 720 175"/>
  </circle>
  <text x="40" y="410" font-family="system-ui, sans-serif" font-size="13" class="muted">The price is a network boundary: timeouts, retries and data you no longer share.</text>
</svg>
