<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Five delivery measures, two directions</title>
  <desc id="d">Throughput is change lead time and deployment frequency; instability is change fail rate, recovery time and rework rate.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .panel{fill:#ffffff;stroke:#1f2933;stroke-width:1.4}
    .good{fill:#e5efe8;stroke:#3f7d5a;stroke-width:1.2}
    .warn{fill:#f3e8d7;stroke:#b7791f;stroke-width:1.2}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">Five delivery measures, two directions</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">Faster flow is only good while the failure side stays healthy.</text>

  <rect x="40" y="110" width="350" height="250" rx="10" class="panel"/>
  <rect x="40" y="110" width="350" height="44" rx="10" class="good"/>
  <text x="215" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" class="ink">throughput</text>
  <text x="70" y="190" font-family="system-ui, sans-serif" font-size="13" class="ink">change lead time</text>
  <text x="70" y="212" font-family="system-ui, sans-serif" font-size="11" class="muted">commit → production</text>
  <text x="70" y="255" font-family="system-ui, sans-serif" font-size="13" class="ink">deployment frequency</text>
  <text x="70" y="277" font-family="system-ui, sans-serif" font-size="11" class="muted">how often value reaches users</text>
  <text x="70" y="330" font-family="system-ui, sans-serif" font-size="12" class="muted">measure the system, not one person</text>

  <rect x="410" y="110" width="350" height="250" rx="10" class="panel"/>
  <rect x="410" y="110" width="350" height="44" rx="10" class="warn"/>
  <text x="585" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" class="ink">instability</text>
  <text x="440" y="190" font-family="system-ui, sans-serif" font-size="13" class="ink">change fail rate</text>
  <text x="440" y="212" font-family="system-ui, sans-serif" font-size="11" class="muted">deploys needing immediate intervention</text>
  <text x="440" y="245" font-family="system-ui, sans-serif" font-size="13" class="ink">failed deployment recovery time</text>
  <text x="440" y="267" font-family="system-ui, sans-serif" font-size="11" class="muted">how long until service returns</text>
  <text x="440" y="300" font-family="system-ui, sans-serif" font-size="13" class="ink">deployment rework rate</text>
  <text x="440" y="322" font-family="system-ui, sans-serif" font-size="11" class="muted">unplanned deploys caused by incidents</text>

  <text x="40" y="410" font-family="system-ui, sans-serif" font-size="13" class="muted">The original four keys were lead time, frequency, fail rate and recovery; DORA now tracks five.</text>
</svg>
