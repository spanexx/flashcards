<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">One writer per piece of data</title>
  <desc id="d">Three services each own their tables; another service reads through the owning service, not by sharing a database.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .svc{fill:#e6eff1;stroke:#2f6f8f;stroke-width:1.3}
    .db{fill:#f3e8d7;stroke:#b7791f;stroke-width:1.3}
    .box{fill:#ffffff;stroke:#1f2933;stroke-width:1.4}
    .cross{stroke:#a23b3b;stroke-width:2.4}
    .read{stroke:#3f7d5a;stroke-width:1.8;stroke-dasharray:7 5;fill:none}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">One writer per piece of data</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">Shared tables feel convenient until two teams change them on the same day.</text>

  <rect x="50" y="140" width="150" height="60" rx="9" class="svc"/>
  <text x="125" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">orders service</text>
  <rect x="50" y="220" width="150" height="52" rx="8" class="db"/>
  <text x="125" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">orders table</text>

  <rect x="300" y="140" width="150" height="60" rx="9" class="svc"/>
  <text x="375" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">payments service</text>
  <rect x="300" y="220" width="150" height="52" rx="8" class="db"/>
  <text x="375" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">payments table</text>

  <rect x="550" y="140" width="150" height="60" rx="9" class="svc"/>
  <text x="625" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">catalog service</text>
  <rect x="550" y="220" width="150" height="52" rx="8" class="db"/>
  <text x="625" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">catalog table</text>

  <rect x="300" y="330" width="150" height="56" rx="9" class="box"/>
  <text x="375" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">reporting service</text>
  <text x="375" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">asks, never writes</text>

  <path d="M 330 330 L 340 278" class="read"/>
  <path d="M 400 330 L 400 278" class="read"/>
  <text x="330" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#3f7d5a">read via API</text>

  <line x1="200" y1="300" x2="250" y2="350" class="cross"/>
  <line x1="250" y1="300" x2="200" y2="350" class="cross"/>
  <text x="225" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a23b3b">no shared table</text>

  <text x="40" y="430" font-family="system-ui, sans-serif" font-size="13" class="muted">The owner defines the schema, the write path and the promise about freshness.</text>
</svg>
