<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">An eval set is the test suite for behaviour</title>
  <desc id="d">A dataset feeds a model, graders score the output, and a gate decides whether the change ships.</desc>
  <style>
    .paper{fill:#fbf8f1}.ink{fill:#1f2933}.muted{fill:#6b7280}
    .box{fill:#ffffff;stroke:#1f2933;stroke-width:1.5}
    .data{fill:#e6eff1;stroke:#2f6f8f;stroke-width:1.2}
    .model{fill:#f3e8d7;stroke:#b7791f;stroke-width:1.2}
    .grade{fill:#e5efe8;stroke:#3f7d5a;stroke-width:1.3}
    .gate{fill:#dbe7dc;stroke:#3f7d5a;stroke-width:1.5}
    .back{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
  </style>
  <rect class="paper" width="800" height="450"/>
  <text x="40" y="44" font-family="system-ui, sans-serif" font-size="21" font-weight="650" class="ink">An eval set is the test suite for behaviour</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" class="muted">You cannot assert exact strings, so you assert outcomes on a fixed set of cases.</text>

  <rect x="40" y="160" width="140" height="90" rx="9" class="data"/>
  <text x="110" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">eval set</text>
  <text x="110" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">cases + expected traits</text>

  <rect x="230" y="160" width="140" height="90" rx="9" class="model"/>
  <text x="300" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">prompt + model</text>
  <text x="300" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">the change under test</text>

  <rect x="420" y="130" width="150" height="50" rx="8" class="grade"/>
  <text x="495" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">rules</text>
  <rect x="420" y="190" width="150" height="50" rx="8" class="grade"/>
  <text x="495" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">model judge</text>
  <rect x="420" y="250" width="150" height="50" rx="8" class="grade"/>
  <text x="495" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" class="ink">human sample</text>

  <rect x="620" y="160" width="140" height="90" rx="9" class="gate"/>
  <text x="690" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" class="ink">ship or block</text>
  <text x="690" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">score vs baseline</text>

  <path d="M 180 205 L 225 205" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 370 205 L 415 170" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 370 205 L 415 215" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 370 205 L 415 265" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 570 205 L 615 205" stroke="#1f2933" stroke-width="1.6" fill="none"/>
  <path d="M 690 250 Q 690 360 495 360 Q 300 360 300 255" class="back"/>
  <text x="500" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" class="muted">a failure becomes a new case</text>

  <text x="40" y="430" font-family="system-ui, sans-serif" font-size="13" class="muted">Track the score, the cost and the latency together; a better answer can still be too slow.</text>
</svg>
