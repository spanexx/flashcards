 there is a full line and a rule for hiding part of it.\n\n**14. More than one answer can be right, and this is a real gap in the judge.** For a programming card, \"so many ways to arrive at the answer\" is the normal case, not an edge case. A judge that string-matches one expected answer will mark correct work wrong. This belongs to the judge's seam - equivalence rules authored by the pack, or a provider judge that reasons about equivalence - and is recorded here as a consequence rather than solved here. The multiple-answer problem is named, not answered.\n\n**15. Reaffirmed, already locked in the evidence model:** with a provider available, the A, I, judges the learner's answer rather than the learner calling it themselves. The tutor decision adds no new judging path; it is the existing pluggable judge being used.\n\n**16. Where the truth comes from depends on the subject, and the pack is the source of truth where it can be - but not exclusively.** The ticket creator rejected the framing that forced one answer for everything. Some decks can inherit their truth entirely from the pack, because a pack may carry material that is simply correct - a Polish grammar table, a set of working functions. Other subjects reach past what any pack contains.\n\n**17. Two things are judged, not one: the answer reached, and how it was reached.** An open-ended question can be arrived at many ways. The judge is asked about the answer the learner landed on, and separately about the route taken. This is the sharpest thing in the ticket and it does not fit the locked evidence model as stated, so how it fits is recorded below.\n\n**How the method judgement fits without breaking the evidence model:** the method is judged **at answer time and folded into the single outcome the row already carries**. A correct answer reached by faulty reasoning is \"Nearly\" - right, a detail slipped - which is exactly what \"Nearly\" means. A correct answer reached by sound reasoning is \"Got it\". Nothing is added to the row: how well the learner did now *includes* how they did it, and the four locked outcomes still carry it. Storing the method separately would have meant storing a conclusion about the learner's reasoning, which the evidence model forbids, so it is judged into the outcome and not kept.\n\n**What this forces, named rather than discovered later:** judging the method requires the learner to **show it**, so cards need a place to show working beside the place to give the answer. That is a second kind of editable region alongside the dotted blank, pack-declared like every other surface. And every free-recall card now needs a provider for **two** judgements instead of one, so the expensive lane doubles in breadth. That cost is accepted here, not quietly carried.\n\n**18. The learner's shown working is shown back to them, beside the correct one.** Not folded silently into a score, not discarded: the learner sees their own route next to the working route, so they can see *where* it went wrong. For a language this is the valuable part - knowing you said \"nie jem chleba\" is much less useful than seeing it sitting beside \"nie jem chleba\" with the ending explained.\n\n**19. And the algorithm adapts to it.** The learner added this, and it is the half that makes the feedback structural rather than decorative. The adaptation runs entirely through the locked evidence model, which is why it costs nothing new: the method was judged into the single outcome at decision 17, the outcome is the row, and the algorithm reads the row. So the algorithm adapts **to the outcome the method produced**, never to the reasoning text itself.\n\n**What this means in practice, and it is worth stating plainly:** the learner's shown working is displayed during the answer and then **discarded - never stored**. A card where the learner always lands on the right answer by a bad route sits at \"Nearly\" for good, and the algorithm therefore keeps it in rotation, because on the evidence it is a card not yet properly learned. Sloppiness becomes visible as persistent weakness, which is exactly what weakness should mean in this system. The text of the reasoning is not kept; the consequence of it is.\n\nThis also keeps the evidence model's promise intact under pressure: no conclusion about the learner's reasoning is stored anywhere. The adaptation is a read-time conclusion, derived fresh from a row, exactly as the model requires.\n\n**20. No ceiling on what the tutor may spend.** Every call is a call, the price is named, and the learner pays it. A per-session cap and a per-call price display were both considered and rejected: a cap turns the tutor into something that must be rationed, and a budget the tutor can exhaust mid-session is the tutor going silent for reasons the learner chose earlier rather than reasons that happened.\n\nAccepted with it: **the tutor's cost is unbounded by design, and the shape of the tutor makes it larger than it first appears** - it may speak unprompted, it generates full lines, and each free-recall card costs a provider call for the answer plus another for the method. The learner's protection is visibility and consent, not a limit: the standing session banner names every prompt, the key is the learner's own, and nothing is ever sent that the learner has not approved for that session.\n\n## Resolution\n\nThe tutor is an **algorithm choice**, not a new kind of session, which is why it fits the system at all: selection was always the learner's own swappable thing, so \"the tutor decides the deck\" is one implementation of an existing seam rather than a new authority in the app. It teaches mid-session - before, during, after - through words it writes and an optional voice that reads them. It talks in texts, never in an open line, reacts to what the learner answered rather than to time, and cannot nag because no channel exists on which to nag. When the provider dies it degrades to local, which in practice means judging survives and teaching stops, since Laya generates no text.\n\nThree of its decisions were reversals of earlier locked decisions, recorded here and carried into the tickets that own them: **decision 12** withdraws the generation gate's proposal state and per-card human judgement, **decision 12 with the tutor's prompt** makes a fourth app prompt shape beyond the three the gate locked, and **decision 17** folds a judged method into the single outcome rather than storing it. The evidence model itself was not amended — every one of those fits the row exactly as locked, which was the point of choosing them.\n\nThe deepest result is decision 13: **the model writes the whole correct thing and the application derives the exercise.** The model never places a blank. That single move dissolved the blank-placement worry, made the truth readable on every card, and turned card generation from \"ask a model to build an exercise\" into \"ask a model for truth, then take it apart\".\n\n**Still owed to other tickets and not solved here:** equivalence for many-valid answers (the judge's seam); whether packs may ship pre-written hints as a free offline floor (pack shape); and **Should generation be batch-aware**, which decision 12 largely dissolves and which should be revisited rather than grilled.\n\n## Interaction with existing tickets\n\n- Touches **Should generation be batch-aware** - decision 12 largely dissolves it. That ticket asked how bulk generation should be reviewed without drowning the learner in review; the answer is now that the review does not happen, and a batch of forty is simply forty cards. That ticket should be revisited and most likely closed rather than grilled.\n- **Requires an amendment to The generation gate**, which is written there, not here: the proposal state, per-card judgement, and the accept step are withdrawn by decision 12 above.\n- **Requires a fourth prompt shape in that same amendment** - the tutor's prompt is not one of the three app-owned slots.\n- Named as a consequence, not solved here: **The judge seam** - multiple valid answers to a code card need equivalence, which neither string-matching nor a base Laya checkpoint supplies.\n- Constrained by **What the learner knows, and what leaves their machine** and **One session, end to end**.","filename":"ai-tutor-session.md","blocked":[]},{"id":8,"slug":"polish-walkthrough","title":"Polish, end to end","type":"prototype","status":"resolved **delivery:** feature-pipeline","blocks":"T4, T6, T7","bodyMd":"# Polish, end to end\n\n## Question\n\nBuild one rough, concrete artifact that carries a real subject all the way through, to test whether the other decisions hold together: a learner installs a Polish pack, generates their first cards, reviews and edits the proposals, runs a session, and sees progress.\n\nThe value is not a design immediately it is the friction it exposes. Anything that requires the core to know what Polish is, or that forces a decision already claimed as locked, shows up here as a crack in the design. Link the artifact from the ticket; do not paste it in.\n\n## Asset\n\n- [wireframe/polish-walkthrough/](../../../wireframe/polish-walkthrough/index.html) — the walkthrough: pack → plan → gate → session → progress. Open `index.html` in the hub folder.\n- [wireframe/polish-walkthrough/friction.md](../../../wireframe/polish-walkthrough/friction.md) — what Polish pressed on. This is the valuable output.\n\n## Resolution\n\nPolish was substituted for Spanish before building, because it is a harder test: seven cases, verb aspect, gender agreement. A design that survives Polish survives anything; Spanish would have let sloppiness hide.\n\n**What held.** Every locked decision expressed Polish without the core learning what Polish is. The plain-text summary, two-sided card shape, append-only evidence, four outcomes, no-scores progress, pack-as-data, and three prompt slots all carried a language the core knows nothing about.\n\n**What did not hold — three frictions:**\n\n1. **Grouping assumed one topic per card.** A Polish noun belongs to seven case topics at once. T4's wording never said per-card topics are single, but the walkthrough's pack format had to make grouping a *list*, not a label. Correction owed to T4's resolution — route via drift/surgical-change.\n\n2. **Generation is not batch-aware.** Polish reuses one noun across seven cases, so the generator offered the same card seven times in one batch, differing only by asked case. Nothing in the locked design stops or wants this. New question, needs its own ticket: should generation know what is already proposed in the same batch?\n\n3. **Free recall is the expensive lane.** For Polish, the interesting cards are typed text with diacritics — exactly the lane Laya cannot judge locally. Fixed-answer sets are real but are the *narrower* kind of card. Consequence named: free recall costs by default; the learner judges when the provider is off. Worth revisiting: local fine-tuning on the subject's own material, or pack-authored equivalence rules. Both fit the locked design; neither is chosen.\n\n## Answers given during the session\n\n1. Is Polish an acceptable substitute for Spanish? -> Better. Harder test; exposes what Spanish would hide.\n2. Was the artifact built? -> Yes — a five-page wireframe plus a friction log, linked above.\n3. Did any locked decision need reopening? -> No. One unsaid assumption in T4 needs wording back; one new question (batch-aware generation) needs a ticket; one cost (free recall) was named for the first time.\n","filename":"polish-walkthrough.md","blocked":[4,6,7]},{"id":9,"slug":"batch-aware","title":"Should generation be batch-aware","type":"grilling","status":"open","blocks":"-","bodyMd":"# Should generation be batch-aware\n\n## Question\n\nSurfaced by [Polish, end to end](polish-walkthrough.md) (ticket 8).\n\nPolish reuses the same noun across seven case topics. When the provider generated a batch of cards for the genitive, it offered *kot → kota*, then the same card again, differing only by the case being asked. Twenty proposals, three nouns, no variety.\n\nNothing in the locked design stops this, and nothing in it wants it.\n\nDecide: should generation know what is already proposed in the same batch, so it does not repeat itself? If yes — how does it know, what does it see, and does that conflict with the privacy boundary (only app-chosen categories may leave)? If no — is a repetition-prone generator acceptable because the learner throws away repeats at the gate, and the rejection-as-shape signal eventually teaches it?\n\nNote: any solution must keep the pack to three prompt slots and must never put learner text into a prompt.\n\n## Where it came from\n\n[Polish, end to end](polish-walkthrough.md) — friction 2. Full account in [wireframe/polish-walkthrough/friction.md](../../wireframe/polish-walkthrough/friction.md).\n","filename":"batch-aware.md","blocked":[]},{"id":10,"slug":"answering-surface","title":"How a card is answered — the answering surface","type":"prototype","status":"resolved **delivery:** feature-pipeline","blocks":"-","bodyMd":"# How a card is answered — the answering surface\n\n## Question\n\nRaised by Victor as a request for the full experience: flashcards must not be one plain input in one place. The answer should be collected **where the question is asked** — a dotted line in a sentence means \"edit here\".\n\nDecide what the answering surface is, as a presentation-layer rule the core can host without knowing any subject:\n\n- A card may collect its answer **inline**: dotted, editable regions sitting inside the prompt text itself, typed in place.\n- A card may collect by **pick**: fixed chips from a known set — the free, local, Laya lane.\n- A card may collect as **one typed free-text answer** — the provider lane.\n- A card may collect after **audio**: hear it, then type.\n\nQuestion behind the question: is the answering surface pack-authored data (the pack decides which regions are editable, like every other pack rule), and the core just hosts a dotted-blank editor? That is the shape consistent with packs-as-data.\n\nFriction found while building (to resolve or swallow): a cloze card has **multiple blanks**, and the locked outcomes — Again / Got it / Nearly / No — are per answer. Multiple blanks means multiple judgments on one card, which the evidence model did not anticipate.\n\n## Asset\n\n- [wireframe/polish-walkthrough/experience/](../../../wireframe/polish-walkthrough/experience/index.html) — the full interactive experience: plan, then cards you type into, chips, and listen-and-type; reveal; four outcomes; wrong cards return; the no-report ending.\n\n## Resolution\n\nThe answering surface is **pack-authored and the core hosts it**. The card's prompt side may carry **editable regions** — dotted spaces in a running sentence, typed in place — alongside the surfaces already locked: a fixed set of picks and one typed free-text answer, including hear-then-type. A dotted region means \"this is where your answer belongs\"; it is no different in kind from an attachment slot, because it is declared by the pack and the core only hosts it. The core never needs to know what case or aspect means to host a dotted blank.\n\n**Which surface a given card gets depends on the question, and that choice belongs to the pack/deck — never a global setting.** A dotted blank exists because the question is asked inside a sentence; a chip list exists because the answer has a known set; one typed answer exists because there is nothing to point at. The same deck can carry all four side by side, and the deck decides, card by card.\n\n**Friction this ticket surfaced and did not resolve: a multi-blank card is multiple answers on one card.** The evidence model (T3) is one row per answer attached to one card; a cloze card with two blanks produces two judgments. The walkthrough settled them per blank as an interim, but whether a row can carry a region index — or whether a blank is its own micro-card — is a real design question for the evidence ticket, and it is logged there as an addendum, not reopened here.\n\n## Answers given during the session\n\n1. Should typing be part of the experience? -> Yes, everywhere answering happens, not one plain input.\n2. Should editable dotted regions exist wherever the question asks? -> Yes. The dash means \"edit here\", declared by the pack, hosted by the core.\n3. Did this create a locked-decision conflict? -> One: multi-blank cards produce several judgments on one card, which the evidence model did not anticipate. Logged as an addendum to T3.\n","filename":"answering-surface.md","blocked":[]},{"id":11,"slug":"ai-tutor-session","title":"The A, I, tutor: the session where the tutor is the model","type":"grilling","status":"resolved **delivery:** feature-pipeline","blocks":"-","bodyMd":"# The A, I, tutor: the session where the tutor is the model\n\n## Question\n\nVictor proposes a fully A, I,-powered session: the model acts as the tutor, decides what the next deck is, generates cards depending on how the learner is doing, and makes the whole session very interactive. The first real subject is languages, so this lane matters. He is explicit that the reordering of existing cards need not be the model's job; the generation is the part he wants powered.\n\nDecide: what the tutor is allowed to do that the ordinary algorithm does not; whether \"decides the next deck\" is one call at session start, a rolling call during the session, or generation on demand when a deck runs dry; how the tutor's requests obey the privacy boundary and the generation gate; what happens when the provider is unreachable mid-session; whether the tutor is a named toggle the learner can switch off and still have a session; and whether the tutor ever speaks outside the card surface, for example a short line of encouragement or a spoken correction, or whether the only words it contributes are the cards themselves.\n\nConstraints already locked and inherited, not re-litigated here: selection is the learner's own pluggable algorithm, so a tutor is one algorithm option rather than a new kind of session; generation goes through the generation gate, so tutor-generated cards are proposals before they count; only app-chosen categories leave the machine and the prompt is visible first; the app is fully usable with no provider; algorithm failure falls back silently at once and implausible output counts as failure.\n\n## Resolution (in progress)\n\n**1. The tutor teaches mid-session, not only picks and generates.** The tutor may interrupt the card flow: a hint before the learner answers, a correction after, a line of encouragement. It is a tutor, not a scheduler, and the session is meant to be very interactive - languages first, where this lane is the point. It speaks on its own initiative rather than only when asked.\n\n**2. A hint costs the point: a helped card cannot be recorded as \"Got it\".** The strongest cap available is \"Nearly\" - substantially correct, a detail slipped - because a hint means the answer was not produced unaided, and \"Got it\" means correct. Lapsed and gap outcomes stay as they are, since a hint does not change whether the learner knew the material.\n\nRationale for accepting the cost the ticket creator named against it, that it teaches the learner to refuse help: this is the only option of the three that leaves the evidence row **exactly as locked**. No hint field, no amendment to the evidence model, and the row's promise - how well, how long, times seen before, nothing else - survives intact. The learner is not lied to and is not lied *for*. The downside is real and accepted: a learner may learn to work without help, which is a worse teacher than one that admits when a card was too hard.\n\n**3. A requested hint is capped exactly like an offered one.** The learner asking the tutor for help does not exempt them: a helped card cannot be recorded as \"Got it\", whether the tutor chose to help or the learner did. The learner was given the answer in both cases, so the row says the same thing in both cases.\n\nThis does not make asking a trap, and the reason is the shape of the cap. A hint converts a possible \"Again\" or \"No\" into a guaranteed \"Nearly\" - substantially correct, a detail slipped. Asking is therefore a rational trade the learner makes knowingly, not a penalty for asking. Offering the same help before the learner asks saves the same point at the same cap, which is why the tutor is free to do both without any asymmetry in the record.\n\nAlso locked with it: **asking is never rationed and never withheld to save money.** The tutor may be asked for a hint on any card, and the cost of that call falls on the provider, not on the learner's access to help. A system that made help harder to get because it was expensive would be the exact opposite of a tutor.\n\n**4. The tutor chooses for itself when to speak.** It is not restricted to triggering on evidence of struggle. It may interrupt on its own judgement the way a human tutor does - before, during, or after a card - and the learner's response is the only brake. The evidence-reactive alternative was rejected as too much like the algorithm: it would make the tutor a second algorithm rather than a teacher.\n\nAccepted costs, named rather than hidden: **cost becomes unpredictable**, because calls happen at the tutor's discretion rather than at a countable rate, and the tutor can talk more than a learner wants. **Interruptions can arrive at moments the algorithm would have kept quiet**, including after a correct answer, which the evidence model already accommodates because the outcome is recorded on the card, not on the tutor's commentary.\n\n**5. One standing prompt per session, not one per interruption.** Before the session begins the learner sees the full shape of every prompt the tutor will send while that session runs - the standing request, the weak topics, the level, the learning style, the card text already decided to be shown, and the shape of the tutor's own instructions - and approves it once. Every interruption the tutor makes afterwards rides on that banner. Per-interruption prompts were rejected because a tutor that interrupts freely would then interrupt the learner with permission dialogs, and the interactivity would die on arrival.\n\nThis resolves the tension with the privacy boundary without weakening it: the boundary promises the learner **sees the prompt before it leaves the machine**, and a session banner is still the learner seeing the prompt before it leaves, just amortised across the interruptions of one sitting rather than repeated per call. The banner is per session and does not persist; each new session asks again.\n\nAlso locked with it: the tutor's speech never widens what leaves the machine. Anything the tutor says back that was not already inside the approved banner is refused rather than sent, exactly as a pack asking for unsanctioned learner text is refused. A tutor that tried to widen its own reach would be treated as a pack overreach, not as a tutor being helpful.\n\n**6. The tutor's explanations become cards, reviewed like any generated card.** When the tutor teaches - a correction, a clarification, a rule the learner did not have - the teaching is not chatter that evaporates and not a note bolted onto an existing card. It becomes a **card**, proposed through the generation gate exactly as any other generated card is. The learner accepts it, edits it, or rejects it, and only an accepted card enters the deck.\n\nInherited, not optional, and recorded here because this decision leans on all of them:\n\n- **The generation gate does not bend.** Proposed or yours, nothing between; every proposal judged individually; an edit makes a new card with zero history; rejection is remembered as a shape and never as wording. A tutor explanation gets no special treatment because it is good.\n- **This is the batch-aware problem in its sharpest form** and collides head-on with the open ticket **Should generation be batch-aware**. A tutor that teaches freely now produces a queue of proposals, and the gate locked to reviews one at a time will interrupt the session the tutor was meant to make interactive. That ticket should be resolved as part of this one or before it.\n- **A tutor card is a free-recall card**, which is the expensive lane: no fixed answer set exists, so the provider judges it or the learner does. The tutor's teaching raises the cost of learning rather than lowering it, and this is accepted rather than pretended away.\n- **The tutor is a fourth prompt shape.** The generation gate locked three app-owned prompt slots and no more - request, questions, deck. Tutor instructions are not any of those three. This is an open amendment to that locked decision, not a quiet exception, and it must be written into the generation gate's own resolution rather than living only here.\n- **A tutor card must not inflate progress.** The progress view answers what the learner can do now that they could not before, and reads only card-scoped evidence. Tutor cards are study material; if they began showing as progress, the read would be flattering itself.\n\n**7. The tutor does not repeat itself, and it needs no memory of its own to do it.** The tutor is told what it has already proposed and it will not propose the same teaching twice.\n\nCrucially, **this adds no new stored state.** The tutor's memory *is* the card set plus the generation history, both of which already exist: cards carry provenance and content, so \"have I explained this before\" is a question answerable by reading what is already on disk, and the generation gate already remembers every rejection as a shape. That list is handed to the tutor in its prompt rather than kept in a tutor-shaped store of its own.\n\nThis matters because it keeps a promise the evidence model made. Storing what the tutor has said would be storing a conclusion, and conclusions are derived at read time and never stored. What the tutor has said is not a conclusion about the learner - it is a fact about the deck - and it is recoverable from what the deck already holds. A tutor memory file would have been a conclusion wearing a disguise.\n\n**8. \"No repeats\" governs proposals, not teaching; the evidence decides repetition.** The tutor will not re-propose a card the learner already has, but it may teach a point again when the learner's own evidence says the point was lost. Absolute non-repetition and time-limited memory were both rejected: the first refuses to re-teach what the learner demonstrably forgot, the second invents a clock rule where a better rule already exists in the evidence.\n\nThis reads the four locked outcomes directly, which is the strongest argument for it:\n\n- **\"Again\"** - wrong but familiar, a lapse - is precisely the case where teaching it again is repair, not repetition.\n- **\"No\"** - wrong and not previously known, a gap - is not a repeat at all. It is a first teaching of something the learner has never had, so the non-repetition rule does not touch it.\n\nSo the tutor needs no memory of whether it personally taught before, and no lapse bookkeeping of its own. The read side already answers the question, from evidence the learner can see and correct.\n\n**9. When the provider dies mid-session the tutor degrades to local rather than vanishing.** The session never stalls and never stops to ask. What survives is whatever can be done offline on the learner's own machine, and the tutor goes quiet only in the part that genuinely cannot be done.\n\n**The honest scope of that fallback, recorded because it is smaller than it sounds:** Laya is a typed decision engine that picks from a supplied answer set. It does not generate text, so it cannot produce a hint, a correction, or a teaching line - there is nothing for it to say. What it can carry is **judgement where a fixed answer set exists**. So a free-recall card still falls back to the learner calling it, exactly as the evidence model locked, and the tutor's teaching stops while the session continues. Silence is not a bug; it is the absence of a provider.\n\nThis sharpens the judge's seam rather than solving it: offline, the interesting cards are still the ones no local judge can check.\n\n**Noted as a possible floor, not decided:** a pack may ship pre-written hints, which are local, free, and always available. That would give the tutor a local voice when the provider is gone. Whether packs may carry hints is a pack-shape question and belongs to **A pack's shape, and the library-ready gate**, not to this ticket.\n\n**10. Both, and the card chooses - the pack declares the channel, the tutor fills in the words.** A hint or correction may be written or spoken, and the pack declares which, exactly as the answering surface is pack-declared and the core merely hosts. The tutor supplies the words either way.\n\n**This solves accessibility for free, and the reason is worth stating:** the tutor writes the words and the voice merely reads them. The text always exists, because it is what the voice is reading. Nothing the tutor says exists only as sound, so a spoken hint is never a barrier to a learner who cannot hear it, and a written hint is always re-readable later.\n\nTwo consequences accepted with it: the voice is a local, free, offline capability while the words are a provider call, so a spoken hint needs the provider for the words but not for the voice; and the tutor's words still become cards, so a spoken correction produces a card with the same gate review as a written one.\n\n**11. The tutor talks in texts, not in an open line.** Every exchange is a message out and a message back. There is no held-open connection of any kind - no socket, no call waiting on the other end, nothing alive while the learner thinks.\n\nThree things follow, and all three were stated as the point of the decision:\n\n- **The tutor reacts to what the learner answered, never to time.** It does not watch the clock during silence and has nothing to say during it.\n- **Time taken is recorded locally and sent later, in its own batch**, after the learner has answered. It is never part of the live reply, so a slow answer is never seen by the model as hesitation in the moment.\n- **The tutor cannot nag.** With no line held open there is no channel on which it could say \"why are you not answering\". Silence belongs to the learner. This is a flashcard, not a proctor.\n\nThis also keeps the privacy boundary honest in a way an open connection would not: while the learner is thinking, nothing is pending on a provider and nothing is being measured off-machine.\n\n**12. Generated decks are machine-validated and accepted, not reviewed by hand.** The learner rejected a review button for generated cards as well as imports. The system checks that the output is well-formed and that blanks are placed in sane positions, and then the cards are cards. There is no proposal state, no per-card judgement, and no accept button.\n\n**This reverses a locked decision and must be recorded as an amendment, not smuggled in.** The generation gate locked: proposed or yours, nothing between; every proposal judged individually; rejection remembered as a shape; an edit makes a new card with zero history.\n\nWhat dies: the proposal state, per-card human judgement, and the accept step.\nWhat survives: an edit still makes a new card with zero history; the origin note still names the generation request on every generated card; the three app-owned prompt slots still stand, with the tutor's prompt already logged above as a fourth shape needing its own amendment.\n\n**The reason the reversal is survivable, and the thing that replaces the gate:** the evidence model becomes the detector. A card that is false cannot hide, because every time it is shown it produces bad evidence, and a card that is missed over and over while its topic neighbours are fine looks exactly like a card that is wrong. The gate was a door; this is a floor. The safety net is the record the learner already keeps.\n\n**13. The model writes the whole correct thing; the app makes the exercise out of it.** This is the decision that answers the blank-placement problem at the root, and it came from the ticket creator, not from the questions.\n\nA generated card does not arrive with blanks in it. It arrives as **the full, correct line** - the complete Polish sentence, the complete working function - and the application then blanks out pieces for the learner to attempt. The model is never asked to place a blank correctly, because the model never places blanks. It writes truth; the app derives the exercise.\n\nThree things this buys:\n\n- **The truth lives in exactly one place per card.** Every blank is a view of the same full line, so a card cannot disagree with itself, and a mistake in the content is visible in one spot rather than scattered across gaps.\n- **The full line is always available.** The learner can see the complete thing the card was made from, which is a far better check than any dialog: something wrong is wrong in a way you can see.\n- **Blank placement stops being a guessing problem.** The earlier worry that a system would misplace a blank by guessing mostly dissolves, because there is no guessing - there is a full line and a rule for hiding part of it.\n\n**14. More than one answer can be right, and this is a real gap in the judge.** For a programming card, \"so many ways to arrive at the answer\" is the normal case, not an edge case. A judge that string-matches one expected answer will mark correct work wrong. This belongs to the judge's seam - equivalence rules authored by the pack, or a provider judge that reasons about equivalence - and is recorded here as a consequence rather than solved here. The multiple-answer problem is named, not answered.\n\n**15. Reaffirmed, already locked in the evidence model:** with a provider available, the A, I, judges the learner's answer rather than the learner calling it themselves. The tutor decision adds no new judging path; it is the existing pluggable judge being used.\n\n**16. Where the truth comes from depends on the subject, and the pack is the source of truth where it can be - but not exclusively.** The ticket creator rejected the framing that forced one answer for everything. Some decks can inherit their truth entirely from the pack, because a pack may carry material that is simply correct - a Polish grammar table, a set of working functions. Other subjects reach past what any pack contains.\n\n**17. Two things are judged, not one: the answer reached, and how it was reached.** An open-ended question can be arrived at many ways. The judge is asked about the answer the learner landed on, and separately about the route taken. This is the sharpest thing in the ticket and it does not fit the locked evidence model as stated, so how it fits is recorded below.\n\n**How the method judgement fits without breaking the evidence model:** the method is judged **at answer time and folded into the single outcome the row already carries**. A correct answer reached by faulty reasoning is \"Nearly\" - right, a detail slipped - which is exactly what \"Nearly\" means. A correct answer reached by sound reasoning is \"Got it\". Nothing is added to the row: how well the learner did now *includes* how they did it, and the four locked outcomes still carry it. Storing the method separately would have meant storing a conclusion about the learner's reasoning, which the evidence model forbids, so it is judged into the outcome and not kept.\n\n**What this forces, named rather than discovered later:** judging the method requires the learner to **show it**, so cards need a place to show working beside the place to give the answer. That is a second kind of editable region alongside the dotted blank, pack-declared like every other surface. And every free-recall card now needs a provider for **two** judgements instead of one, so the expensive lane doubles in breadth. That cost is accepted here, not quietly carried.\n\n**18. The learner's shown working is shown back to them, beside the correct one.** Not folded silently into a score, not discarded: the learner sees their own route next to the working route, so they can see *where* it went wrong. For a language this is the valuable part - knowing you said \"nie jem chleba\" is much less useful than seeing it sitting beside \"nie jem chleba\" with the ending explained.\n\n**19. And the algorithm adapts to it.** The learner added this, and it is the half that makes the feedback structural rather than decorative. The adaptation runs entirely through the locked evidence model, which is why it costs nothing new: the method was judged into the single outcome at decision 17, the outcome is the row, and the algorithm reads the row. So the algorithm adapts **to the outcome the method produced**, never to the reasoning text itself.\n\n**What this means in practice, and it is worth stating plainly:** the learner's shown working is displayed during the answer and then **discarded - never stored**. A card where the learner always lands on the right answer by a bad route sits at \"Nearly\" for good, and the algorithm therefore keeps it in rotation, because on the evidence it is a card not yet properly learned. Sloppiness becomes visible as persistent weakness, which is exactly what weakness should mean in this system. The text of the reasoning is not kept; the consequence of it is.\n\nThis also keeps the evidence model's promise intact under pressure: no conclusion about the learner's reasoning is stored anywhere. The adaptation is a read-time conclusion, derived fresh from a row, exactly as the model requires.\n\n**20. No ceiling on what the tutor may spend.** Every call is a call, the price is named, and the learner pays it. A per-session cap and a per-call price display were both considered and rejected: a cap turns the tutor into something that must be rationed, and a budget the tutor can exhaust mid-session is the tutor going silent for reasons the learner chose earlier rather than reasons that happened.\n\nAccepted with it: **the tutor's cost is unbounded by design, and the shape of the tutor makes it larger than it first appears** - it may speak unprompted, it generates full lines, and each free-recall card costs a provider call for the answer plus another for the method. The learner's protection is visibility and consent, not a limit: the standing session banner names every prompt, the key is the learner's own, and nothing is ever sent that the learner has not approved for that session.\n\n## Resolution\n\nThe tutor is an **algorithm choice**, not a new kind of session, which is why it fits the system at all: selection was always the learner's own swappable thing, so \"the tutor decides the deck\" is one implementation of an existing seam rather than a new authority in the app. It teaches mid-session - before, during, after - through words it writes and an optional voice that reads them. It talks in texts, never in an open line, reacts to what the learner answered rather than to time, and cannot nag because no channel exists on which to nag. When the provider dies it degrades to local, which in practice means judging survives and teaching stops, since Laya generates no text.\n\nThree of its decisions were reversals of earlier locked decisions, recorded here and carried into the tickets that own them: **decision 12** withdraws the generation gate's proposal state and per-card human judgement, **decision 12 with the tutor's prompt** makes a fourth app prompt shape beyond the three the gate locked, and **decision 17** folds a judged method into the single outcome rather than storing it. The evidence model itself was not amended — every one of those fits the row exactly as locked, which was the point of choosing them.\n\nThe deepest result is decision 13: **the model writes the whole correct thing and the application derives the exercise.** The model never places a blank. That single move dissolved the blank-placement worry, made the truth readable on every card, and turned card generation from \"ask a model to build an exercise\" into \"ask a model for truth, then take it apart\".\n\n**Still owed to other tickets and not solved here:** equivalence for many-valid answers (the judge's seam); whether packs may ship pre-written hints as a free offline floor (pack shape); and **Should generation be batch-aware**, which decision 12 largely dissolves and which should be revisited rather than grilled.\n\n## Interaction with existing tickets\n\n- Touches **Should generation be batch-aware** - decision 12 largely dissolves it. That ticket asked how bulk generation should be reviewed without drowning the learner in review; the answer is now that the review does not happen, and a batch of forty is simply forty cards. That ticket should be revisited and most likely closed rather than grilled.\n- **Requires an amendment to The generation gate**, which is written there, not here: the proposal state, per-card judgement, and the accept step are withdrawn by decision 12 above.\n- **Requires a fourth prompt shape in that same amendment** - the tutor's prompt is not one of the three app-owned slots.\n- Named as a consequence, not solved here: **The judge seam** - multiple valid answers to a code card need equivalence, which neither string-matching nor a base Laya checkpoint supplies.\n- Constrained by **What the learner knows, and what leaves their machine** and **One session, end to end**.","filename":"ai-tutor-session.md","blocked":[]},{"id":12,"slug":"deck-import","title":"A deck you brought yourself: import without A, I","type":"grilling","status":"open","blocks":"-","bodyMd":"# A deck you brought yourself: import without A, I\n\n## Question\n\nVictor proposes that learners can bring their own decks without using A, I, at all: import a J, S, O, N, file, or paste J, S, O, N, text into the app, and it becomes a deck. He is explicit that this also serves people who do not want to use A, I, at any point - the whole app must be worth using with every generation feature switched off.\n\nDecide: what an imported artefact is - a full pack, or a deck of cards belonging to a pack that is already installed; whether import is one format or several, and whether a plain-text or delimited format exists alongside J, S, O, N, so that someone can paste from anywhere; what identity an imported deck carries, given that card identity is provenance plus content; whether imported cards skip the generation gate, since a human wrote them, and what happens when the importing human did not write them; what the origin note on an imported card says; whether import runs the pluggable checker, in warning mode, and whether a broken import is refused with the offending line named, the way a broken pack is; and how an imported deck sits next to generated cards when the tutor is on - can a tutor improve a deck the learner brought, or only generate new ones.\n\nConstraints already locked and inherited, not re-litigated here: packs are plain files and never running code; import is all-or-nothing and chunked; broken cards are rejected by rule, out-of-place cards are flagged by a pluggable checker and never blocked; card identity is provenance plus content so progress cannot be orphaned; the app is fully usable with no provider.\n\n## Interaction with existing tickets\n\n- Sharpens the map's fog item **How a learner authors a pack** - this ticket is the one inlet into that fog, and does not settle the rest of it.\n- Constrained by **What goes on a card** and **A pack's shape, and the library-ready gate**.","filename":"deck-import.md","blocked":[]},{"id":13,"slug":"how-you-open-it","title":"How the learner opens the app","type":"grilling","status":"resolved **delivery:** feature-pipeline","blocks":"-","bodyMd":"# How the learner opens the app\n\n## Question\n\nThe map carried this as fog: desktop application, or a browser tab on the learner's own machine. It could not stay fog any longer, because the first build decides it whether or not the decision was made on purpose. Locked as part of taking on version one, and it carries a consequence for a decision that was already made elsewhere - see below.\n\nDecide: how the app is opened and closed; where it runs; what the learner sees when the machine is offline; and what the build is required to do before it counts as working.\n\n## Resolution\n\n**A browser tab on the learner's own machine.** The learner starts a local Express process and opens a URL served from loopback. Angular is the interface, served by Express, on the learner's machine, and nowhere else. Accepted costs: a visible process the learner must start, and a browser tab rather than an application icon. Reason the stack is well matched: the app is served locally anyway, and it means the app is fully usable with no provider and no network, which the privacy ticket locked as a hard requirement.\n\n**What this does to the key store: nothing. An earlier reading of this ticket said the browser made T2 unbuildable, and that reading was wrong.** Only the *page* cannot reach the OS key store - Windows Credential Manager, the macOS Keychain, the Linux secret service are all out of reach of page JavaScript, and that is a boundary browsers maintain on purpose. But the page never needs to reach it. The local Express process is Node running natively on the learner's machine, and it can.\n\n**So the key store decision survives intact, and in practice gets stronger.** The key lives in the OS key store exactly as T2 locked. The local process holds it. The page asks the local process to make the provider call, and the key never crosses into the page - not even transiently. Under the original reading the app held the key and a front-end mistake could reach it; under this one the front end provably cannot reach it at all.\n\n**This is now a build requirement, and it is a strict one:** every provider call is made by the local process. The browser sends the prompt to loopback and nothing else. No key, no provider call, and no prompt construction happens in the front end. A build in which Angular holds the key is a build that has drifted from this decision.\n\n**Accepted costs of the browser:** a visible process the learner must start, and a browser tab rather than an application icon.","filename":"how-you-open-it.md","blocked":[]}],"tableByNum":{"1":["1","What goes on a card","grilling","T4, T5","resolved"],"2":["2","What the learner knows, and what leaves their machine","grilling","T5","resolved"],"3":["3","Evidence, and reading it as strength and weakness","grilling","T6","resolved"],"4":["4","A pack's shape, and the library-ready gate","grilling","T8","resolved"],"5":["5","The generation gate: proposed cards become the learner's cards","grilling","T6","resolved"],"6":["6","One session, end to end","grilling","-","resolved"],"7":["7","Reading progress back","grilling","T3","resolved"],"8":["8","Polish, end to end","prototype","T4, T6, T7","resolved"],"9":["9","Should generation be batch-aware","grilling","-","open"],"10":["10","How a card is answered - the answering surface","prototype","-","resolved"],"11":["11","The A, I, tutor: the session where the tutor is the model","grilling","-","resolved"],"12":["12","A deck you brought yourself: import without A, I","grilling","-","open"],"13":["13","How the learner opens the app","grilling","-","resolved"]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LS_KEY = 'wf-map-' + DATA.name;
const NODE_W = 220, NODE_BASE_H = 64, COL_GAP = 96, ROW_GAP = 32;

let view = { scale: 1, panX: 0, panY: 0 };
let nodeOffsets = {};   // { ticketId: {x, y} }
let selectedId = null;
let pendingPan = null;

// ── persistence ──────────────────────────────────────────────────
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ view, nodeOffsets, selectedId })); } catch {}
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.view) view = s.view;
    if (s.nodeOffsets) nodeOffsets = s.nodeOffsets;
    if (s.selectedId != null) selectedId = s.selectedId;
  } catch {}
}

// ── topo layout (default positions, override per saved offset) ──
function topoDepth(t, memo) {
  if (memo.has(t.id)) return memo.get(t.id);
  memo.set(t.id, 0);
  let max = 0;
  for (const b of t.blocked) {
    const dep = DATA.tickets.find(x => x.id === b);
    if (!dep) continue;
    const d = topoDepth(dep, memo) + 1;
    if (d > max) max = d;
  }
  memo.set(t.id, max);
  return max;
}
function layout() {
  const memo = new Map();
  DATA.tickets.forEach(t => topoDepth(t, memo));
  const layers = new Map();
  for (const t of DATA.tickets) {
    const d = memo.get(t.id);
    if (!layers.has(d)) layers.set(d, []);
    layers.get(d).push(t);
  }
  const sortedDepths = [...layers.keys()].sort((a, b) => a - b);
  const positions = {};
  for (const d of sortedDepths) {
    const col = layers.get(d);
    col.sort((a, b) => a.id - b.id);
    col.forEach((t, i) => {
      const x = 80 + d * (NODE_W + COL_GAP);
      const y = 80 + i * (NODE_BASE_H + ROW_GAP + 30);
      positions[t.id] = { x, y };
    });
  }
  return positions;
}

// ── render ───────────────────────────────────────────────────────
function render() {
  const layer = document.getElementById('layer');
  const edges = document.getElementById('edges');
  const positions = layout();

  // nodes
  layer.innerHTML = '';
  for (const t of DATA.tickets) {
    const off = nodeOffsets[t.id] || positions[t.id];
    const el = document.createElement('div');
    el.className = 'node' + (selectedId === t.id ? ' selected' : '');
    el.dataset.type = t.type;
    el.dataset.id = t.id;
    el.style.left = off.x + 'px';
    el.style.top = off.y + 'px';
    el.style.width = NODE_W + 'px';
    const blocksLabel = '';  // unused; edges tell the blocks story
    el.innerHTML = `
      <div class="ribbon"></div>
      <div class="body">
        <div class="num">#${t.id} · ${t.type}</div>
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="badges">
          ${t.blocked.length ? `<span class="badge blocks">→ ${t.blocked.length}</span>` : ''}
          <span class="badge">${t.status}</span>
        </div>
      </div>`;
    layer.appendChild(el);
    bindNode(el, t, off);
  }

  // edges
  let pathHtml = '';
  for (const t of DATA.tickets) {
    if (!t.blocked.length) continue;
    const from = nodeOffsets[t.id] || positions[t.id];
    for (const b of t.blocked) {
      const tgt = DATA.tickets.find(x => x.id === b);
      if (!tgt) continue;
      const to = nodeOffsets[tgt.id] || positions[tgt.id];
      const x1 = from.x + NODE_W;
      const y1 = from.y + NODE_BASE_H / 2;
      const x2 = to.x;
      const y2 = to.y + NODE_BASE_H / 2;
      const mid = (x1 + x2) / 2;
      const d = y1 === y2
        ? `M ${x1} ${y1} L ${x2} ${y2}`
        : `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
      pathHtml += `<path d="${d}" marker-end="url(#arr)" />`;
    }
  }
  edges.innerHTML = `
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="var(--border)" />
      </marker>
    </defs>${pathHtml}`;

  applyTransform();
}

function applyTransform() {
  const layer = document.getElementById('layer');
  const edges = document.getElementById('edges');
  const t = `translate(${view.panX}px, ${view.panY}px) scale(${view.scale})`;
  layer.style.transform = t;
  layer.style.transformOrigin = '0 0';
  edges.style.transform = t;
  edges.style.transformOrigin = '0 0';
}

function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ── node interactions (drag + click) ─────────────────────────────
function bindNode(el, t, base) {
  let startX = 0, startY = 0, offX = 0, offY = 0, dragged = false;
  el.addEventListener('mousedown', e => {
    e.stopPropagation();
    selectedId = t.id;
    render();
    openDetail(t);
    startX = e.clientX; startY = e.clientY;
    offX = (nodeOffsets[t.id] || base).x;
    offY = (nodeOffsets[t.id] || base).y;
    dragged = false;
    el.classList.add('dragging');

    function onMove(e) {
      const dx = (e.clientX - startX) / view.scale;
      const dy = (e.clientY - startY) / view.scale;
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      dragged = true;
      const nx = offX + dx, ny = offY + dy;
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
      nodeOffsets[t.id] = { x: nx, y: ny };
      drawEdgesLive();
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      el.classList.remove('dragging');
      save();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}
function drawEdgesLive() {
  // redraw edges without rebuilding nodes (cheap)
  const edges = document.getElementById('edges');
  const positions = layout();
  let pathHtml = '';
  for (const t of DATA.tickets) {
    if (!t.blocked.length) continue;
    const from = nodeOffsets[t.id] || positions[t.id];
    for (const b of t.blocked) {
      const tgt = DATA.tickets.find(x => x.id === b);
      if (!tgt) continue;
      const to = nodeOffsets[tgt.id] || positions[tgt.id];
      const x1 = from.x + NODE_W, y1 = from.y + NODE_BASE_H / 2;
      const x2 = to.x, y2 = to.y + NODE_BASE_H / 2;
      const mid = (x1 + x2) / 2;
      const d = y1 === y2
        ? `M ${x1} ${y1} L ${x2} ${y2}`
        : `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
      pathHtml += `<path d="${d}" marker-end="url(#arr)" />`;
    }
  }
  edges.innerHTML = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--border)" /></marker></defs>${pathHtml}`;
  applyTransform();
}

// ── detail panel ────────────────────────────────────────────────
function openDetail(t) {
  const panel = document.getElementById('detail');
  const body = document.getElementById('detailBody');
  // show only summary; user opens the .md file for the full body
  body.innerHTML = `
    <h2>${escapeHtml(t.title)}</h2>
    <div class="meta-row">
      <span class="badge">#${t.id} · ${t.type}</span>
      <span class="badge">${t.status}</span>
    </div>
    <div style="color:var(--text-dim);font-size:0.85rem;margin-bottom:0.6rem">
      File: <a href="tickets/${t.filename}" class="file" style="color:var(--accent)">tickets/${t.filename}</a>
    </div>
    <div style="margin-bottom:0.6rem"><strong style="color:var(--text-dim);font-size:0.75rem">BLOCKS</strong>
      <div style="font-size:0.9rem;margin-top:0.2rem">${t.blocked.length ? t.blocked.map(b => '#' + b).join(', ') : '—'}</div>
    </div>
    <div style="margin-bottom:0.6rem"><strong style="color:var(--text-dim);font-size:0.75rem">QUESTION</strong></div>
    <div class="content" style="font-size:0.85rem;line-height:1.5">${escapeHtml((t.bodyMd.split('\n').slice(1).join('\n') || '').slice(0, 800))}${t.bodyMd.length > 800 ? '…' : ''}</div>
  `;
  panel.classList.add('open');
}
document.getElementById('closeDetail').onclick = () => {
  selectedId = null;
  document.getElementById('detail').classList.remove('open');
  render();
  save();
};

// ── canvas pan + zoom ───────────────────────────────────────────
const canvas = document.getElementById('canvas');
canvas.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  selectedId = null;
  document.getElementById('detail').classList.remove('open');
  render();
  canvas.classList.add('panning');
  pendingPan = { startX: e.clientX, startY: e.clientY, sx: view.panX, sy: view.panY };
});
window.addEventListener('mousemove', e => {
  if (!pendingPan) return;
  view.panX = pendingPan.sx + (e.clientX - pendingPan.startX);
  view.panY = pendingPan.sy + (e.clientY - pendingPan.startY);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  if (pendingPan) { pendingPan = null; canvas.classList.remove('panning'); save(); }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const ns = Math.min(Math.max(view.scale * delta, 0.3), 3);
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  view.panX = mx - (mx - view.panX) * ns / view.scale;
  view.panY = my - (my - view.panY) * ns / view.scale;
  view.scale = ns;
  applyTransform();
  save();
}, { passive: false });

document.getElementById('zoom-in').onclick = () => { view.scale = Math.min(view.scale * 1.3, 3); applyTransform(); save(); };
document.getElementById('zoom-out').onclick = () => { view.scale = Math.max(view.scale / 1.3, 0.3); applyTransform(); save(); };
document.getElementById('zoom-reset').onclick = () => {
  const positions = layout();
  const xs = Object.values(nodeOffsets).length ? Object.values(nodeOffsets) : Object.values(positions);
  if (!xs.length) return;
  const minX = Math.min(...xs.map(p => p.x));
  const minY = Math.min(...xs.map(p => p.y));
  const maxX = Math.max(...xs.map(p => p.x + NODE_W));
  const maxY = Math.max(...xs.map(p => p.y + NODE_BASE_H));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const rect = canvas.getBoundingClientRect();
  view.scale = Math.min((rect.width - 80) / (maxX - minX), (rect.height - 80) / (maxY - minY), 1);
  view.panX = rect.width / 2 - cx * view.scale;
  view.panY = rect.height / 2 - cy * view.scale;
  applyTransform();
  save();
};

// ── populate bottom rail (terse) ────────────────────────────────
function minimalMd(s, max = 280) {
  // strip headings, keep bullets + first paragraph only; cap length
  const lines = s.split('\n').filter(l => !/^#/.test(l));
  const out = [];
  let len = 0;
  for (const l of lines) {
    if (/^[-*]s+/.test(l)) { out.push(l); len += l.length; }
    else if (/^s*$/.test(l)) continue;
    else { if (!out.length || out[out.length-1].startsWith('-')) out.push(l); else out[out.length-1] += ' ' + l; len += l.length; }
    if (len > max) break;
  }
  if (out.join(' ').length > max) return out.join(' ').slice(0, max) + '…';
  return out.join('\n');
}
function setRail(id, body, fallback) {
  const el = document.getElementById(id);
  const text = (body || fallback || '').trim();
  if (!text || text === '*none.*') { el.innerHTML = '<span class="empty">none yet</span>'; return; }
  // render just first 1-2 lines
  el.innerHTML = renderInlineMd(text.slice(0, maxLen(id))).replace(/\n/g, '<br>');
}
function maxLen(id) { return id === 'r-decisions' ? 240 : id === 'r-fog' ? 320 : 240; }
function renderInlineMd(s) {
  let out = escapeHtml(s);
  out = out.replace(new RegExp('\*\*(.+?)\*\*', 'g'), '<strong>$1</strong>');
  out = out.replace(new RegExp('`([^`]+)`', 'g'), '<code>$1</code>');
  out = out.replace(new RegExp('\[([^\]]+)\]\(([^)]+)\)', 'g'), '<a href="$2">$1</a>');
  return out;
}
setRail('r-dest', DATA.destination, '*destination not yet named.*');
setRail('r-decisions', DATA.decisions, '');
setRail('r-fog', DATA.fog, '');
setRail('r-oos', DATA.oos, '');

// ── stats + init ────────────────────────────────────────────────
document.getElementById('stat-total').textContent = DATA.tickets.length;
document.getElementById('stat-open').textContent = DATA.tickets.filter(t => t.status === 'open').length;
document.getElementById('stat-resolved').textContent = DATA.tickets.filter(t => t.status !== 'open').length;

load();
render();
if (selectedId != null) {
  const t = DATA.tickets.find(x => x.id === selectedId);
  if (t) openDetail(t);
}
setTimeout(() => document.getElementById('zoom-reset').click(), 50);
</script>
